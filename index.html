<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d4a">
<meta name="description" content="Daftar harga & stok ready PGNet Computer — processor, RAM, SSD & part komputer. Update otomatis.">

<title>Katalog PGNet</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--latar:#f5f3ee;--kartu:#fffefb;--garis:#e5e1d8;--garis2:#efebe3;--tinta:#2b2a27;--abu:#6b675f;--abu2:#9a958b;--hijau:#2f5d4a;--hijau2:#e4eee8;--wa:#1f9d55;--oranye:#b3541e;--merah:#b3412f}
html,body{margin:0;height:100%}
body{background:#e9e7e1;color:var(--tinta);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit}
.app{height:100dvh;background:var(--latar);display:flex;flex-direction:column;position:relative;overflow:hidden;max-width:520px;margin:0 auto}
@media(min-width:600px){body{display:flex;align-items:center;justify-content:center;padding:20px}
 .app{width:390px;height:min(820px,calc(100vh - 40px));border:8px solid #2e2c29;border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.25)}}
.kepala{background:var(--hijau);color:#fff;padding:12px 14px 11px;flex:none}
.judul{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.logo{background:#fff;color:var(--hijau);border-radius:7px;font-size:11px;padding:2px 6px;font-weight:900}
.info{font-size:11.5px;opacity:.82;margin-top:2px}
.cari{margin-top:10px;background:#fff;border-radius:11px;display:flex;align-items:center;gap:6px;padding:0 10px}
.cari input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 0;background:transparent;color:var(--tinta)}
.cari .ik{color:var(--abu2)}
.cari .x{color:var(--abu2);cursor:pointer;padding:6px;display:none}
.cari.ada .x{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:var(--kartu);border-bottom:1px solid var(--garis);flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--garis);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--abu);background:#fff;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--hijau);border-color:var(--hijau);color:#fff}
.atas{flex:none;background:var(--kartu);border-bottom:1px solid var(--garis)}
.tabs{display:flex;gap:6px;padding:9px 10px}
.tab{flex:1 1 auto;border:1px solid var(--garis);border-radius:18px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--abu);background:#fff;cursor:pointer;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--hijau);border-color:var(--hijau);color:#fff}
.tabs.cari-mode .tab{opacity:.55}
.sub{display:flex;gap:3px;margin:0 10px 9px;padding:3px;background:#f1eee7;border-radius:12px}
.sub:empty{display:none}
.sc{flex:1 1 0;min-width:0;border:0;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:700;color:var(--abu);background:transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.sc.on{background:#fff;color:var(--hijau);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.infoCari{padding:0 12px 9px;font-size:12px;color:var(--abu)}
.isi{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
/* ---- judul kategori & kelompok (dasar) ---- */
section{position:relative}
.kat{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;height:var(--kh)}
.kat .kj{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kat .kn{flex:none}
.grup{position:sticky;top:var(--kh);z-index:1;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.grup .gn{flex:1;min-width:0}
.grup .gn b{display:block;font-size:14.5px;font-weight:700;color:var(--tinta)}
.grup .gu{flex:none;font-size:12.5px;font-weight:700}
.grup .pn{flex:none;width:12px;text-align:center;color:var(--abu2);font-size:20px;line-height:1;transition:transform .15s}
.grup.buka .pn{transform:rotate(90deg)}
/* ---- judul kategori: pita hijau ---- */
.app{--kh:46px}
.kat{background:var(--hijau);color:#fff;padding:0 14px;font-size:14px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.kat .kn{background:rgba(255,255,255,.2);border-radius:10px;padding:2px 9px;font-size:11.5px;text-transform:none;letter-spacing:0}
.grup{background:#fff;padding:9px 12px 9px 14px;border-bottom:1px solid var(--garis2)}
.grup .gu{color:var(--hijau);background:var(--hijau2);border-radius:10px;padding:2px 8px}
.grup.buka{background:#eef5f0}
.gisi .item{padding-left:24px;background:#fbfaf7}
/* hasil cari: judul kelompok tidak perlu bisa ditutup */
.cari-aktif .grup{cursor:default}.cari-aktif .grup .pn{display:none}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-bottom:1px solid var(--garis2);background:var(--kartu);cursor:pointer}
.item:active{background:#f1ede5}
.item.dikeranjang{background:#f3f8f4}
.item .nm{flex:1;min-width:0;font-size:14px}
.item .nm mark{background:#fff0b3;color:inherit;border-radius:2px}
.item .hrg{font-weight:800;white-space:nowrap;font-size:14.5px}
.item .hrg.tanya{font-weight:600;color:var(--abu2);font-size:12.5px}
.tb{flex:none;min-width:34px;height:34px;border-radius:17px;border:1.5px solid var(--hijau);background:#fff;color:var(--hijau);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px}
.tb.isi-k{background:var(--hijau);color:#fff;font-size:13.5px}
.tb:disabled{border-color:var(--garis);color:var(--abu2);cursor:default}
.stok{font-size:11.5px;color:var(--abu2);margin-top:1px}
.stok.sedikit{color:var(--oranye);font-weight:700}
.kosong{padding:40px 20px;text-align:center;color:var(--abu2);font-size:14px}
.kosong b{display:block;color:var(--tinta);margin-bottom:4px}
.jumlah{padding:8px 14px;font-size:12px;color:var(--abu)}
.bawah{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--kartu);border-top:1px solid var(--garis);display:flex;gap:8px}
.wa{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);color:#fff;border-radius:11px;padding:12px;font-weight:800;font-size:14px;text-decoration:none;border:0;width:100%;cursor:pointer}
.wa.kecil{width:48px;flex:none;padding:12px 0;font-size:17px}
.btnKer{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--hijau);color:#fff;border:0;border-radius:11px;padding:10px 14px;cursor:pointer;text-align:left}
.btnKer b{font-size:14px}.btnKer span{font-size:12px;opacity:.85}
.btnKer .tot{font-weight:800;font-size:14.5px;white-space:nowrap}
.naik{position:absolute;right:14px;bottom:140px;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--hijau);border:1px solid var(--garis);font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;cursor:pointer;z-index:3}
.naik.on{display:block}
.tirai{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:8;display:none}
.tirai.on{display:block}
.lembar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));z-index:9;transform:translateY(105%);transition:transform .22s ease;max-height:88%;display:flex;flex-direction:column}
.lembar.on{transform:none}
.lembar .gulir{overflow-y:auto;flex:1;min-height:0}
.pegangan{width:40px;height:4px;border-radius:2px;background:#d6d1c7;margin:4px auto 12px;flex:none}
.lembar .kc{font-size:11.5px;font-weight:700;color:var(--hijau);text-transform:uppercase;letter-spacing:.3px}
.lembar h3{margin:4px 0 6px;font-size:17px;line-height:1.3}
.lembar .hb{font-size:22px;font-weight:800;margin:6px 0 2px}
.lembar .hb.tanya{font-size:15px;color:var(--abu)}
.lembar .ket{font-size:12px;color:var(--abu);margin:12px 0;background:#f5f3ee;border-radius:10px;padding:9px 11px}
.lembar .tutup{background:none;border:0;color:var(--abu);font-size:14px;width:100%;padding:10px;margin-top:2px;cursor:pointer}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--garis);border-radius:12px;overflow:hidden;flex:none}
.stepper button{width:40px;height:40px;border:0;background:#fff;font-size:20px;font-weight:700;color:var(--hijau);cursor:pointer}
.stepper button:disabled{color:#cfcac0;cursor:default}
.stepper .n{min-width:36px;text-align:center;font-weight:800;font-size:16px}
.stepper.kcl button{width:32px;height:32px;font-size:17px}
.stepper.kcl .n{min-width:28px;font-size:14px}
.baris-aksi{display:flex;gap:10px;align-items:center;margin-top:4px}
.btnHijau{flex:1;background:var(--hijau);color:#fff;border:0;border-radius:11px;padding:12px;font-weight:800;font-size:14px;cursor:pointer}
.btnGaris{width:100%;background:#fff;color:var(--wa);border:1.5px solid var(--wa);border-radius:11px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.hapusK{background:none;border:0;color:var(--merah);font-size:13px;padding:8px 0 0;cursor:pointer}
.kjudul{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex:none}
.kjudul h3{margin:0}
.kjudul .hapusK{padding:0}
.kgrup{font-size:11.5px;font-weight:800;color:var(--hijau);text-transform:uppercase;letter-spacing:.3px;margin:12px 0 2px}
.kb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--garis2)}
.kb .nm{flex:1;min-width:0;font-size:13.5px}
.kb .rinci{font-size:12px;color:var(--abu);margin-top:1px}
.kb .rinci b{color:var(--tinta)}
.ktotal{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:12px 0 4px;flex:none}
.pratinjau{margin:6px 0 10px;flex:none}
.pratinjau summary{font-size:12.5px;color:var(--abu);cursor:pointer;padding:4px 0}
.pratinjau pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#f3f1ec;border-radius:10px;padding:10px;margin:6px 0 0;max-height:180px;overflow:auto}
.kaki{flex:none}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#2b2a27;color:#fff;font-size:13px;padding:9px 14px;border-radius:20px;opacity:0;transition:all .2s;pointer-events:none;z-index:20;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%)}
.offline{color:#ffd9a8;font-weight:700}
.kosong .kecil{font-size:11.5px;color:var(--abu2);margin-top:10px}
.putar{width:28px;height:28px;border:3px solid var(--garis);border-top-color:var(--hijau);border-radius:50%;margin:0 auto 12px;animation:putar .8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.kat .kanan{display:flex;align-items:center;gap:6px;flex:none}
/* ikon pilih-untuk-dibagikan: kecil & halus */
.ibagi{flex:none;position:relative;width:28px;height:28px;border-radius:14px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,color .15s,transform .1s}
.ibagi:active{transform:scale(.9)}
.ibagi svg{width:15px;height:15px;display:block}
.ibagi .cek{display:none}
.kbagi{background:rgba(255,255,255,.14);color:#fff}
.gbagi{background:transparent;color:#a39d92}
.ibagi.dipilih{background:#fff;color:var(--hijau)}
.gbagi.dipilih{background:var(--hijau);color:#fff}
.ibagi.dipilih .ik{display:none}.ibagi.dipilih .cek{display:block}
.ibagi.ikut{opacity:.45;pointer-events:none}
.grup.dipilih{background:#f3f8f4}
/* bar bagikan (muncul kalau ada yang dipilih) */
.barBagi{position:absolute;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;display:none;align-items:center;gap:8px;background:#1f2b25;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.barBagi.on{display:flex}
.barBagi.on ~ .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.barBagi .bi{flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.barBagi .bi b{display:block;font-size:14px}
.barBagi .bi span{opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barBagi .bb{border:0;background:#fff;color:#1f2b25;font-weight:800;font-size:13.5px;border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.barBagi .bb svg{width:15px;height:15px}
.barBagi .bx{border:0;background:transparent;color:#cfe0d6;font-size:18px;width:32px;height:32px;cursor:pointer}
.opsi{display:grid;gap:8px;margin:12px 0 6px}
.op{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;border:1.5px solid var(--garis);background:#fff;border-radius:14px;padding:11px 12px;cursor:pointer}
.op .oi{grid-row:1/3;font-size:24px;display:flex;align-items:center;justify-content:center;background:var(--hijau2);border-radius:10px}
.op b{font-size:14.5px;color:var(--tinta)}.op small{font-size:12px;color:var(--abu)}
.op.on{border-color:var(--hijau);background:#f3f8f4}
.hasilBagi img{width:100%;border-radius:10px;border:1px solid var(--garis);display:block;margin:8px 0}
.hasilBagi pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#f3f1ec;border-radius:10px;padding:10px;margin:8px 0;max-height:240px;overflow:auto}
.hasilBagi .ket2{font-size:12px;color:var(--abu);margin:6px 0}
section.sorot .kat{animation:sorot 1.6s ease 2}
@keyframes sorot{50%{background:#1f9d55}}
</style></head>
<body>
<div class="app">
  <div class="kepala">
    <div class="judul"><span class="logo">PG</span>Katalog PGNet</div>
    <div class="info" id="info">Memuat…</div>
    <div class="cari" id="cariBox"><span class="ik">🔍</span><input id="cari" type="search" placeholder="Cari: i5 8400, nvme 512, ddr4 8gb…" autocomplete="off" enterkeyhint="search"><span class="x" id="hapus">✕</span></div>
  </div>
  <div class="atas"><div class="tabs" id="tabs"></div><div class="sub" id="sub"></div></div>
  <div class="isi" id="isi"></div>
  <button class="naik" id="naik" title="Ke atas">↑</button>
  <div class="barBagi" id="barBagi"></div>
  <div class="bawah" id="bawah"></div>
  <div class="toast" id="toast"></div>
  <div class="tirai" id="tirai"></div>
  <div class="lembar" id="lembar"></div>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   KATALOG PGNET — tampilan HP
   Data dari Apps Script (tab Database), disimpan di browser,
   dicek ulang tiap 5 menit.
   ============================================================ */
/* Link Apps Script ada di file config.js (APPS_SCRIPT_URL) */
var APPS_SCRIPT_URL = window.APPS_SCRIPT_URL || '';

var UMUR_DATA = 5*60*1000;              // 5 menit
var LS_DATA = 'pgnet_katalog_v1';       // simpanan data katalog
var LS_KER  = 'pgnet_keranjang_v1';     // simpanan keranjang

var WA='', JAM='', UPD='', TS=0, TAB=['Processor','RAM','SSD','Others Parts'], SUB=[[],[],[],[]];
var KAT=[], PETA={}, ADA_DATA=false, SEDANG=false, GAGAL=false;

var $=function(id){return document.getElementById(id);};
var aktif=0,subAktif=[0,0,0,0],q='',buka={},DAFTAR=[];   // semua kelompok tertutup di awal
function rp(n){return 'Rp'+n.toLocaleString('id-ID');}
function angka(n){return n.toLocaleString('id-ID');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return s.toLowerCase().replace(/[-_/.,()+]/g,' ').replace(/\s+/g,' ').trim();}
function cocok(nama,kata){
  if(!kata.length)return true;
  var n=norm(nama),rapat=n.replace(/ /g,'');
  return kata.every(function(w){return n.indexOf(w)>=0||rapat.indexOf(w)>=0;});
}
function tandai(nama,kata){
  var h=esc(nama); if(!kata.length)return h;
  kata.forEach(function(w){ if(w.length<2)return;
    var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    h=h.replace(re,'<mark>$1</mark>');});
  return h;
}
function stokHtml(q){return q<=2?'<div class="stok sedikit">sisa '+q+'</div>':'<div class="stok">stok '+q+'</div>';}
function waLink(teks){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(teks);}
var tt;function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on');},1800);}
function lsBaca(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsTulis(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ===================== DATA ===================== */
function pakaiData(d){
  WA=d.wa||WA; JAM=d.jam||JAM; UPD=d.upd||''; TS=d.ts||Date.now();
  if(d.tab)TAB=d.tab; if(d.sub)SUB=d.sub;
  KAT=(d.kat||[]).map(function(k){
    return {k:k.j,t:k.t,s:k.s,g:k.g.map(function(g){
      return {n:g[0],it:g[1].map(function(x){return {n:x[0],q:x[1]||0,h:x[2]||0,kat:k.j,t:k.t,s:k.s};})};})};
  });
  PETA={}; KAT.forEach(function(k){k.g.forEach(function(g){g.it.forEach(function(x){PETA[x.n]=x;});});});
  Object.keys(KER).forEach(function(n){ var x=PETA[n];        // barang terjual habis / stok turun
    if(!x||!x.q)delete KER[n]; else if(KER[n]>x.q)KER[n]=x.q; });
  lsTulis(LS_KER,KER);
  subAktif=subAktif.map(function(v,i){return v<subAda(i).length?v:0;});
  var pertama=!ADA_DATA; ADA_DATA=true;
  var gulir=$('isi').scrollTop;
  gambar(); gambarBawah(); tulisInfo();
  $('isi').scrollTop=gulir;
  if(pertama)bukaDariLink();                                  // posisi baca tidak loncat saat data diperbarui
}
function tulisInfo(){
  $('info').innerHTML=(UPD?'Update '+esc(UPD):'Memuat…')+(JAM?' · '+esc(JAM):'')+
    (GAGAL&&ADA_DATA?' · <span class="offline">data terakhir, belum tersambung</span>':'');
}
function ambilData(){
  if(SEDANG)return; SEDANG=true;
  if(!/^https:\/\/script\.google\.com\//.test(APPS_SCRIPT_URL)){SEDANG=false;gagal('Link Apps Script belum diisi di config.js');return;}
  var ctrl=window.AbortController?new AbortController():null, batas=setTimeout(function(){if(ctrl)ctrl.abort();},20000);
  fetch(APPS_SCRIPT_URL+'?format=json&t='+Date.now(),{signal:ctrl?ctrl.signal:undefined,cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Server '+r.status);return r.json();})
    .then(function(d){
      clearTimeout(batas); SEDANG=false;
      if(!d||!d.kat)throw new Error('Data tidak dikenali');
      GAGAL=false; d.diambil=DIAMBIL=Date.now(); lsTulis(LS_DATA,d); pakaiData(d);
    })
    .catch(function(e){ clearTimeout(batas); SEDANG=false; gagal(e&&e.name==='AbortError'?'Koneksi terlalu lama':(e&&e.message)); });
}
function gagal(pesan){
  GAGAL=true;
  if(ADA_DATA){tulisInfo();return;}
  $('isi').innerHTML='<div class="kosong"><b>Katalog belum bisa dimuat</b>Periksa sinyal internet lalu coba lagi.'+

/* dikelompokkan per jenis (RAM Laptop, SSD SATA, …), urut tab lalu nama jenis */
function kerTerkelompok(){
  var g={};isiKer().forEach(function(k){var key=k.x.t+'|'+k.x.s;(g[key]=g[key]||{t:k.x.t,s:k.x.s,it:[]}).it.push(k);});
  return Object.keys(g).map(function(k){return g[k];})
    .sort(function(a,b){return a.t-b.t||(a.s<b.s?-1:a.s>b.s?1:0);})
    .map(function(x){x.it.sort(function(a,b){return a.x.n<b.x.n?-1:a.x.n>b.x.n?1:0;});return x;});
}
function teksKer(){
  var bl=kerTerkelompok().map(function(g){return g.it.map(function(k){
    var x=k.x;
    return x.n+' ('+k.q+') '+(x.h?angka(x.h):'harga menyusul')+(x.h&&k.q>1?' : '+angka(x.h*k.q):'');
  }).join('\n');});
  var T=totalKer();

/* ===================== BAGIKAN LIST (kategori & kelompok) ===================== */
function slug(s){return norm(s).replace(/[^a-z0-9 ]/g,'').trim().replace(/ +/g,'-');}
/* alamat katalog yang ditulis di gambar & link (bisa diatur lewat variabel LINK_KATALOG) */
function alamatKatalog(){return (window.LINK_KATALOG||(location.host+location.pathname)).replace(/^https?:\/\//,'').replace(/index\.html$/,'');}
function waTampil(){var w='0'+String(WA).replace(/^62/,'');return w.replace(/^(\d{4})(\d{4})(\d+)$/,'$1-$2-$3');}

/* ---- PILIHAN yang akan dibagikan (seperti keranjang) ----
   PILIH.k[indeks kategori] = seluruh kategori ; PILIH.g['ki|gi'] = satu kelompok */
var PILIH={k:{},g:{}};
function kelasPilihG(k,g){var ki=KAT.indexOf(k);return PILIH.k[ki]?' dipilih ikut':(PILIH.g[ki+'|'+k.g.indexOf(g)]?' dipilih':'');}
function pilihKat(ki){
  if(PILIH.k[ki])delete PILIH.k[ki];
  else{PILIH.k[ki]=1;Object.keys(PILIH.g).forEach(function(x){if(x.split('|')[0]==ki)delete PILIH.g[x];});toast('✓ '+KAT[ki].k+' dipilih');}
  segarPilih();
}
function pilihGrup(ki,gi){
  var key=ki+'|'+gi;
  if(PILIH.g[key])delete PILIH.g[key];else{PILIH.g[key]=1;toast('✓ '+KAT[ki].g[gi].n+' dipilih');}

}
function kosongkanPilih(){PILIH={k:{},g:{}};segarPilih();}
function segarPilih(){
  // perbarui tanda di layar tanpa menggambar ulang daftar

  $('isi').querySelectorAll('.gbagi').forEach(function(b){
    var semua=!!PILIH.k[b.dataset.ki], satu=!!PILIH.g[b.dataset.ki+'|'+b.dataset.gi];
    b.classList.toggle('dipilih',semua||satu);b.classList.toggle('ikut',semua);
    b.parentNode.classList.toggle('dipilih',semua||satu);});

}
/* susun list gabungan dari semua pilihan, urut sesuai katalog */
function listPilihan(){
  var sek=[];
  KAT.forEach(function(k,ki){
    if(PILIH.k[ki]){sek.push({judul:k.k,g:k.g,utuh:true,hash:slug(k.k)});return;}
    var gs=k.g.filter(function(g,gi){return PILIH.g[ki+'|'+gi];});
    if(gs.length)sek.push({judul:k.k,g:gs,utuh:false,hash:gs.map(function(g){return slug(k.k)+'/'+slug(g.n);}).join(',')});
  });
  if(!sek.length)return null;
  var nama=[];sek.forEach(function(x){if(x.utuh)nama.push(x.judul);else x.g.forEach(function(g){nama.push(g.n);});});
  var satuGrup=sek.length===1&&!sek[0].utuh&&sek[0].g.length===1;
  return {sek:sek, nama:nama,
    judul:satuGrup?sek[0].g[0].n:(nama.length<=2?nama.join(' + '):nama[0]+' + '+(nama.length-1)+' lainnya'),
    induk:satuGrup?sek[0].judul:'',
    hash:sek.map(function(x){return x.hash;}).join(',')};
}

/* 2) gambar tabel seperti screenshot sheet (dipecah per 55 baris) */
function gambarList(L){
  var S=2,P=16,RH=30,GH=30,HH=84,CH=0,MAX=55;   /* CH=0: tanpa baris judul kolom */
  var banyak=L.sek.length>1, rows=[];
  L.sek.forEach(function(s){
    s.g.forEach(function(g){if(g.n&&!(L.induk&&!banyak))rows.push({g:g.n});g.it.forEach(function(x){rows.push({x:x});});});
  });
  var bag=[];for(var i=0;i<rows.length;i+=MAX)bag.push(rows.slice(i,i+MAX));
  var F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  /* lebar gambar menyesuaikan nama terpanjang → kolom Qty & Harga dekat dengan nama */
  var ukur=document.createElement('canvas').getContext('2d'),maxN=0,maxH=0;
  rows.forEach(function(r){
    if(r.x){ukur.font='500 14px '+F;maxN=Math.max(maxN,ukur.measureText(r.x.n).width);
      ukur.font='800 14px '+F;maxH=Math.max(maxH,ukur.measureText(r.x.h?rp(r.x.h):'Tanya harga').width);}
    else{ukur.font=(r.k?'900 15px ':'800 14px ')+F;maxN=Math.max(maxN,ukur.measureText(r.k?r.k.toUpperCase():'▶ '+r.g).width-40);}
  });
  var QW=44, GAP=18;
  var W=Math.round(Math.max(460,Math.min(720,P+maxN+GAP+QW+GAP+maxH+P)));
  var KH=W-P, KQ=KH-maxH-GAP-QW/2;
  var FH=0;   /* tanpa baris bawah (link & WA dihapus) */
  function potong(c,t,maks){if(c.measureText(t).width<=maks)return t;while(t.length&&c.measureText(t+'…').width>maks)t=t.slice(0,-1);return t+'…';}
  return bag.map(function(p,pi){
    var KB=34, H=HH+CH+p.reduce(function(s,r){return s+(r.k?KB:r.g?GH:RH);},0)+FH;
    var cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;var c=cv.getContext('2d');c.scale(S,S);
    c.fillStyle='#fff';c.fillRect(0,0,W,H);
    c.fillStyle='#2f5d4a';c.fillRect(0,0,W,HH);
    c.fillStyle='#fff';c.beginPath();if(c.roundRect)c.roundRect(P,11,26,17,5);else c.rect(P,11,26,17);c.fill();
    c.fillStyle='#2f5d4a';c.font='900 10.5px '+F;c.fillText('PG',P+5.5,23.5);
    c.fillStyle='#fff';c.font='800 13px '+F;c.fillText(potong(c,'PGNet Computer'+(L.induk?'  ·  '+L.induk:''),W-P*2-33),P+33,24);
    c.font='900 22px '+F;c.fillText(potong(c,L.judul+(bag.length>1?'  ('+(pi+1)+'/'+bag.length+')':''),W-P*2),P,52);
    c.font='500 12.5px '+F;c.globalAlpha=.85;var sub='Update '+UPD+' · harga & stok dapat berubah';if(c.measureText(sub).width>W-P*2)sub='Update '+UPD;c.fillText(potong(c,sub,W-P*2),P,72);c.globalAlpha=1;
    var y=HH;c.textBaseline='middle';
    y+=CH;var z=0;
    p.forEach(function(r){
      if(r.k){c.fillStyle='#dcebe2';c.fillRect(0,y,W,KB);c.fillStyle='#2f5d4a';c.fillRect(0,y,5,KB);c.font='900 15px '+F;c.fillText(potong(c,r.k.toUpperCase(),W-P*2),P,y+KB/2);y+=KB;z=0;return;}
      if(r.g){c.fillStyle='#efe9df';c.fillRect(0,y,W,GH);c.fillStyle='#2f5d4a';c.font='800 14px '+F;c.fillText('▶ '+r.g,P,y+GH/2);y+=GH;z=0;return;}
      c.fillStyle=(z++%2)?'#faf8f4':'#ffffff';c.fillRect(0,y,W,RH);
      c.fillStyle='#efebe3';c.fillRect(0,y+RH-1,W,1);
      c.fillStyle='#2b2a27';c.font='500 14px '+F;c.fillText(potong(c,r.x.n,KQ-QW/2-GAP-P+4),P,y+RH/2);
      c.textAlign='center';c.fillStyle=r.x.q<=2?'#b3541e':'#2b2a27';c.font=(r.x.q<=2?'800 ':'600 ')+'14px '+F;c.fillText(String(r.x.q),KQ,y+RH/2);
      c.textAlign='right';c.fillStyle=r.x.h?'#2b2a27':'#9a958b';c.font=(r.x.h?'800 ':'600 ')+'14px '+F;c.fillText(r.x.h?rp(r.x.h):'Tanya harga',KH,y+RH/2);c.textAlign='left';
      y+=RH;
    });
    return cv;
  });
}
function kirimGambar(L,kanvas){
  var nama='PGNet_'+L.hash.replace(/\//g,'_');
  Promise.all(kanvas.map(function(cv,i){return new Promise(function(ok){cv.toBlob(function(b){ok(new File([b],nama+(kanvas.length>1?'_'+(i+1):'')+'.png',{type:'image/png'}));},'image/png');});}))
  .then(function(files){
    if(navigator.canShare&&navigator.canShare({files:files})){
      navigator.share({files:files,title:L.judul}).catch(function(){});
    }else{
      files.forEach(function(f,i){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();},i*400);});
      toast('Gambar disimpan ke folder Download');
    }
  });
}

/* buka dari link #kategori , #kategori/kelompok , bisa beberapa dipisah koma → langsung terbuka */
function bukaDariLink(){
  var h=decodeURIComponent((location.hash||'').slice(1));if(!h||!ADA_DATA)return;
  var pertama=null;
  h.split(',').forEach(function(bag){
    bag=bag.split('/');var k=KAT.filter(function(x){return slug(x.k)===bag[0];})[0];if(!k)return;
    var g=bag[1]?k.g.filter(function(x){return slug(x.n)===bag[1];})[0]:null;
    (g?[g]:k.g).forEach(function(x){buka[k.k+'|'+x.n]=true;});
    if(!pertama)pertama={k:k,g:g};
  });
  if(!pertama)return;
  var k=pertama.k,g=pertama.g;
  q='';$('cari').value='';$('cariBox').classList.remove('ada');
  aktif=k.t;subAktif[k.t]=Math.max(0,subAda(k.t).indexOf(k.s));
  gambar();
  var sek=document.getElementById('sek-'+slug(k.k)), el=g?document.getElementById('grp-'+slug(k.k)+'--'+slug(g.n)):sek;
  if(el){$('isi').scrollTop=(g?el.offsetTop+sek.offsetTop-46:el.offsetTop);if(sek)sek.classList.add('sorot');}
}
window.addEventListener('hashchange',bukaDariLink);
